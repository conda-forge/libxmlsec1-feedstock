context:
  version: "1.3.12"

package:
  name: libxmlsec1
  version: ${{ version }}

source:
  url: https://github.com/lsh123/xmlsec/releases/download/${{ version }}/xmlsec1-${{ version }}.tar.gz
  sha256: 24045199af12d93fe5fdbbbf7e386e823e4842071e9432e2b90ac108b889a923

build:
  number: 1
  skip: win

requirements:
  run_exports:
    # since 1.3.10, the SONAME encodes the full version (e.g. libxmlsec1.so.10312),
    # so every patch release is ABI-incompatible
    - ${{ pin_subpackage('libxmlsec1', upper_bound='x.x.x') }}
  build:
    - if: unix
      then:
        - gnuconfig
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - make
    - pkg-config
  host:
    - icu
    - libgcrypt
    - libgpg-error
    - libiconv
    - libxml2-devel
    - libxslt
    - openssl
    - liblzma-devel
    - zlib
    - libltdl
  run:
    - ${{ pin_compatible('libltdl') }}
    - ${{ pin_compatible('zlib') }}

tests:
  - script: xmlsec1 --help

about:
  homepage: https://aleksey.com/xmlsec
  license: MIT AND MPL-1.1
  license_file: Copyright
  summary: XML Security Library
  repository: https://github.com/lsh123/xmlsec

extra:
  recipe-maintainers:
    - xhochy
    - jaimergp
